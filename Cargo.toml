# The bridge's tests on the emulator: the 192's side of the SD link
# (linkbench, h264bench, the Android Auto viewer, built with the kit's
# build.sh) against the bridge's card logic built for the host
# (tests/host.c), and end-to-end runs from the SD loader
# (tests/disc.rs). No Rust code of its own: the bridge is C for the
# RP2040, the 192's programs C for the SH-4. The emulator, the `rnse`
# crate, comes from git, pinned to a commit of
# https://github.com/jroark/rnse (Cargo.lock pins it too).
[package]
name = "rnse-sdbridge"
version = "0.1.0"
edition = "2021"
description = "Tests of the RNS-E SD bridge and its 192 programs on the rnse emulator"
license = "MIT"
publish = false

[dev-dependencies]
rnse = { git = "https://github.com/jroark/rnse", rev = "b4446e046df0f11cefa7ebd1e8392b268abaf01c" }

[profile.release]
opt-level = 3
debug = 1
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1
